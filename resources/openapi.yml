openapi: 3.0.0

info:
  title: Clojure Links Cutter API
  version: 0.1.3
  description: API for URL shortening service

paths:
  /api/v1/info:
    get:
      summary: System information endpoint
      description: Returns server uptime and status information
      tags:
        - System
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Server uptime information in human-readable format
                    example: "Web server started successfully. Work time: 2h 15min 30sec 123millis"

  /api/v1/links/{length}:
    get:
      summary: Get list of shortened links
      description: |
        Returns a list of shortened links. The optional `length` parameter controls how many links to return:
        - If omitted or null: returns default number of links (50)
        - If 0: returns all links
        - If positive number: returns that many most recent links
      tags:
        - Links
      parameters:
        - name: length
          in: path
          description: Number of links to return (0 for all links, omit for default)
          required: false
          schema:
            type: integer
            minimum: 0
            example: 10
      responses:
        200:
          description: Successful response with list of links
          content:
            application/json:
              schema:
                type: object
                properties:
                  links:
                    type: array
                    description: List of shortened links
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Short URL code
                          example: "abc123"
                        url:
                          type: string
                          description: Original URL
                          example: "https://example.com/very/long/url"

  /api/v1/links:
    post:
      summary: Create a new shortened link
      description: Creates a shortened URL from the provided original URL
      tags:
        - Links
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  description: Original URL to shorten
                  example: "https://example.com/very/long/url"
      responses:
        200:
          description: Link successfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: Short URL code
                    example: "abc123"
                  url:
                    type: string
                    description: Original URL
                    example: "https://example.com/very/long/url"

  /api/v1/links/{code}:
    delete:
      summary: Delete a shortened link
      description: Deletes a shortened link by its unique code
      tags:
        - Links
      parameters:
        - name: code
          in: path
          description: Short URL code to delete
          required: true
          schema:
            type: string
            example: "abc123"
      responses:
        200:
          description: Link successfully deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Success message
                    example: "Link deleted successful"
        404:
          description: Link not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Error message
                    example: "Link with this code not found"


