name: Links Cutter CI

on:
  pull_request:
  push:

jobs:
  clojure-formatting:
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Setup Clojure tools
        uses: DeLaGuardo/setup-clojure@13
        with:
          cljfmt: 'latest'

      - name: Check formatting
        run: cljfmt check

  markdown-formatting:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Run mdl for check markdown format
        uses: nosborn/github-action-markdown-cli@v3.3.0
        with:
          files: .
          config_file: .markdownlint.yaml

  publish-release:
    needs:
      - clojure-formatting
      - markdown-formatting

    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - run: find ./release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            release/*
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}