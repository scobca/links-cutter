name: Links Cutter CI

on:
  workflow_dispatch:
  pull_request:
  push:

jobs:
  clojure-formatting:
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Setup Clojure tools
        uses: DeLaGuardo/setup-clojure@13
        with:
          cljfmt: 'latest'

      - name: Cache Clojure dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-clojure-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clojure-

      - name: Check formatting
        run: cljfmt check


  markdown-formatting:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Run mdl for check markdown format
        uses: nosborn/github-action-markdown-cli@v3.3.0
        with:
          files: .
          config_file: .markdownlint.yaml


  clojure-testing:
    needs:
      - clojure-formatting

    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Setup Clojure with Leiningen
        uses: DeLaGuardo/setup-clojure@13
        with:
          lein: 'latest'

      - name: Run tests
        run: lein test



  publish-release:
    needs:
      - clojure-formatting
      - clojure-testing
      - markdown-formatting

    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v6

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}